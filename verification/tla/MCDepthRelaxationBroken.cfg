\* Child depth from the parent's CLAIM depth, not its live minimum. Expected: VIOLATION.
\* An early long path is frozen into every descendant, so a node that belongs inside the budget
\* is never expanded and the claimed set stops being a function of the graph and the budget.
CONSTANT LiveMinimum = FALSE
CONSTANT Budget = 3
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT DepthNeverBelowShortestPath
INVARIANT ClaimedIsShortestPathBounded
