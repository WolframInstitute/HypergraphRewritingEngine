\* The scan omits jobs_executing. Expected: PASS -- the counters already cover it, since a worker
\* inside a job has not completed, so submitted and completed cannot agree while it runs. Kept
\* because it says which half of the predicate is load-bearing: the counters, not the scan.
CONSTANT CountsFirst = TRUE
CONSTANT CheckExecuting = FALSE
CONSTANT SubmitBeforeComplete = TRUE
CONSTANT MaxJobs = 4
CONSTANT Workers = {w1, w2}
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoPrematureQuiescence
