\* Shipped protocol at a DEEPER bound than MCSegmentedArray.cfg. Expected: PASS.
\*
\* The shipped cell is 2,284 distinct states and TLC exhausts it in under a second, so its bound
\* was costing nothing and buying correspondingly little. This one is 27,828,731 distinct states,
\* twelve thousand times larger, and takes about a minute.
\*
\* Six threads against five segments, so a claim in the last segment advances the high-water mark
\* past FOUR entire segments' ranges rather than two, and up to six claimants can be outstanding
\* across those gaps at once. That is the shape DenseBelowCount exists for, given room to go wrong
\* in: the counterexample the broken cell produces is two threads holding indices in an uncreated
\* segment while a third claims past it, and the number of ways to arrange that grows with both
\* constants.
\*
\* MEASURED 2026-08-26 on this i9-14900K desktop under WSL2, TLC `-workers 8 -Xmx14g`:
\*   157,960,861 states generated, 27,828,731 distinct, 0 left on queue, 61s. No error.
\* A rented 32-core EPYC was tried and is NOT needed: the shipped cell runs in 3s on the desktop
\* and 5s on the box, because JVM startup dominates at that size, and even this cell is a minute
\* either way. TLC parallelises, but this spec is nowhere near large enough for that to matter.
\*
\* Both cells are kept on purpose: MCSegmentedArray.cfg for a routine gate, this one when a minute
\* is available. Neighbouring points, all exhaustive and clean, for whoever wants to go further:
\* 5 threads/4 segments 626,209 distinct (3s); 6/4 4,926,585 (17s); 7/4 31,142,659 (81s).
CONSTANT CreateInOrder = TRUE
CONSTANT NumSegments = 5
CONSTANT SegSize = 2
CONSTANT Threads = {t1, t2, t3, t4, t5, t6}
SPECIFICATION Spec
INVARIANT DenseBelowCount
INVARIANT CompleteWhenQuiescent
