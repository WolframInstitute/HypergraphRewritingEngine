name: macOS

# ARM64 correctness leg (macos-14 = Apple Silicon). Same OFF flags as the Linux
# gate: no LibraryLink headers, no CUDA, no Vulkan on a bare runner. This is the
# first macOS compile+run signal the project has; clang/libc++ and the ARM64
# memory model are exactly what the Linux leg cannot see.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  macos-tests:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: brew install cmake ninja

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_WOLFRAM_LANGUAGE_PACLET=OFF
          -DBUILD_GPU=OFF
          -DBUILD_VISUALIZATION=OFF

      # THE DEPLOYMENT TARGET IS PART OF THE GATE, not a detail of it. This job takes the
      # runner's default, which is the runner's own OS, and at that target every wait
      # primitive the engine can use is available. The SHIPPED libraries are built by
      # cmake/toolchains/macos-cross.cmake at 10.15, where std::atomic::wait is marked
      # unavailable and os_sync_wait_on_address does not exist before the 14.4 SDK -- so
      # park.hpp took a third path that this leg was structurally unable to compile.
      # Compile-only: linking and running are the job above's, and neither is what the
      # deployment target decides.
      # 10.15 IS A REGRESSION GUARD, NOT THE SHIPPED TARGET. It is where park.hpp once had
      # neither of its two primitives available and could not compile at all (29c9345). Kept
      # compile-only: what it checks is that a path through the fallback chain still exists there.
      - name: Configure at 10.15 (a past release blocker)
        run: >
          cmake -S . -B build-1015 -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
          -DBUILD_WOLFRAM_LANGUAGE_PACLET=OFF
          -DBUILD_GPU=OFF
          -DBUILD_VISUALIZATION=OFF

      - name: Build the library at 10.15
        run: cmake --build build-1015 --target hypergraph

      # THE SHIPPED TARGET, BUILT AND RUN. build_all_platforms.sh passes 11.0 on every macOS
      # configure, so 11.0 is what users get -- and the only macOS binary anything RAN was built
      # at the runner's own OS version, which selects a DIFFERENT blocking primitive from the one
      # shipped. park.hpp chooses by feature macro: os_sync_wait_on_address needs the 14.4 SDK,
      # std::atomic::wait is marked availability(macosx, introduced=11.0), and below both there is
      # a single process-wide mutex and condition variable. Which of the three a build lands on is
      # a property of the deployment target, so testing one says nothing about another.
      #
      # JobSystemTest.ParkingDoesNotUseALock asserts the engine did not land on a lock-taking
      # backend, and until now it had never executed against the shipped configuration.
      - name: Configure at the SHIPPED deployment target (11.0)
        run: >
          cmake -S . -B build-shipped -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DBUILD_WOLFRAM_LANGUAGE_PACLET=OFF
          -DBUILD_GPU=OFF
          -DBUILD_VISUALIZATION=OFF

      - name: Run the suite at the shipped deployment target
        run: |
          cmake --build build-shipped --target all_tests test_job_system
          ./build-shipped/all_tests --gtest_filter=-PacletTest.*
          ./build-shipped/test_job_system

      # THE XCODE GENERATOR, which is a different build system from Ninja and not a formatting
      # choice: it emits an .xcodeproj driven by xcodebuild, it is MULTI-CONFIG (so anything
      # keyed on CMAKE_BUILD_TYPE at configure time behaves differently), and it resolves
      # per-file flags and output directories its own way. A project that only ever configures
      # under Ninja can accumulate assumptions that hold nowhere else, and this is the generator
      # a macOS developer opening the repo will reach for first.
      #
      # Configure and build the library, not the suite: what is being checked is that the
      # generator can express this project, which linking a test binary does not tell us again.
      - name: Configure with the Xcode generator
        run: >
          cmake -S . -B build-xcode -G Xcode
          -DBUILD_WOLFRAM_LANGUAGE_PACLET=OFF
          -DBUILD_GPU=OFF
          -DBUILD_VISUALIZATION=OFF
      - name: Build the engine under Xcode
        run: cmake --build build-xcode --target hypergraph --config Release

      - name: Build tests
        run: cmake --build build --target all_tests

      - name: Run tests
        run: ./build/all_tests --gtest_filter=-PacletTest.*

      # gtest_discover_tests registers _NOT_BUILT failures for missing binaries.
      - name: Build ctest binaries
        run: >
          cmake --build build --target
          test_lockfree_deque test_job_system test_work_stealing_deque
          quotient_reconstruction_probe causal_tr_exactness_probe

      - name: Run ctest suite
        run: ctest --test-dir build -E genmc --output-on-failure
