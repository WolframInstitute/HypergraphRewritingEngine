name: CI

on:
  push:
    branches: [master]
    # The documentation checks are docs.yml's; a push that changes only these builds nothing.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'paclet/Documentation/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'paclet/Documentation/**'
  workflow_dispatch:
  # The sanitizer jobs run nightly (and on pull requests and by hand), not on pushes.
  schedule:
    - cron: '0 3 * * *'

# One run per workflow and branch: a push cancels the run of the push before it, so a burst of
# commits costs one run. The organisation's plan runs 20 jobs at a time across all its
# repositories, 5 of them on macOS.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Linux correctness gate. The Wolfram paclet, the GPU engine, and the visualiser are
# off (a bare runner has no LibraryLink headers, no CUDA, no Vulkan); all_tests is the
# aggregate C++ suite, including the ReferenceOracle brute-force isomorphism check.
# GPU (gpu_differential_tests / hg_gpu_tests) needs a CUDA runner; the paclet golden
# (reference/verify_paclet.wls) needs a Wolfram Engine + a macOS/Windows leg -- both
# tracked as follow-ups.
jobs:
  linux-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_WOLFRAM_LANGUAGE_PACLET=OFF
          -DBUILD_GPU=OFF
          -DBUILD_VISUALIZATION=OFF

      - name: Build tests
        run: cmake --build build --target all_tests

      - name: Run tests
        run: ./build/all_tests --gtest_filter=-PacletTest.*

      # all_tests is NOT the whole suite: ctest carries the concurrency tests
      # (lock-free deque, job system, work-stealing deque) plus the standing
      # probe gates. Their binaries must be BUILT first -- gtest_discover_tests
      # registers a _NOT_BUILT failure for a missing binary, it does not build
      # it. genmc needs a local toolchain and is excluded.
      - name: Build ctest binaries
        run: >
          cmake --build build --target
          test_lockfree_deque test_job_system test_work_stealing_deque
          quotient_reconstruction_probe causal_tr_exactness_probe

      # tla_cells SKIPS without a JVM and tla2tools.jar, and a silent skip is the same as no
      # coverage. The jar is 2.3 MB and the --quick cells are ~20s, so it is fetched here and the
      # gate runs for real. Two of those cells are CALIBRATIONS that must VIOLATE; a spec edit
      # that turns one green is exactly what this catches.
      #
      # PINNED, and the pin is checked rather than assumed: v1.7.4 carries TLC2 2.19, the version
      # verification/tla/README.md records its counts against, and that jar reproduces all four
      # PASS cells exactly (117,005 / 85,777 / 479,005 / 2,284 distinct states) and both VIOLATION
      # verdicts. A toolchain bump is then a deliberate edit against a known baseline.
      - name: Install TLC
        run: |
          mkdir -p "$HOME/tla"
          curl -fsSL -o "$HOME/tla/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          java -version

      - name: Run ctest suite
        run: ctest --test-dir build -E genmc --output-on-failure

      # BUILD_VISUALIZATION is OFF by default and every other leg turns it off explicitly, so
      # the emitter hooks compiled into the engine under HYPERGRAPH_ENABLE_VISUALIZATION were
      # built by nothing. The renderer that consumes the stream lives in its own repository; the
      # emitter is this side of that split and stays here, which means it needs a leg that
      # compiles it or it rots against the engine it is compiled into.
      - name: Configure + build + test with the visualisation emitter on
        run: |
          cmake -S . -B build_viz -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_VISUALIZATION=ON -DBUILD_GPU=OFF \
            -DBUILD_WOLFRAM_LANGUAGE_PACLET=OFF -DBUILD_TESTS=ON
          cmake --build build_viz --target all_tests
          ./build_viz/all_tests --gtest_filter=-PacletTest.*

  # UBSan, ASan and LSan over the whole suite (the sanitizers job) and TSan over the whole suite
  # (the tsan job). The build options have existed since before v1.0.0 and no workflow set any of
  # them, so none was a gate. All stand at zero on this tree, which is what makes any output here
  # a regression.
  # ThreadSanitizer, as its own job because it is the slowest leg: every atomic in a lock-free
  # engine is instrumented and the suite runs under it in tens of minutes. It reports a data race
  # -- a non-atomic access unordered against another thread's -- and every one is a defect in an
  # engine whose contract is that its output is a function of its inputs. Measured clean before
  # this leg existed: 291 tests, no report, 2026-08-28.
  tsan:
    # After the plain suite: no sanitizer build when it already fails. Nightly, on pull requests
    # and by hand; a push does not run it.
    needs: linux-tests
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build

      - name: Configure + build TSan
        run: >
          cmake -S . -B build_tsan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DENABLE_TSAN=ON -DBUILD_GPU=OFF -DBUILD_WOLFRAM_LANGUAGE_PACLET=OFF
          -DBUILD_VISUALIZATION=OFF &&
          cmake --build build_tsan --target all_tests

      # halt_on_error=0 so one report does not hide the rest; the grep gates, because the
      # sanitizer's report does not move the process exit status -- and the suite's own status
      # gates too, for the same reason as the other legs.
      - name: TSan — the suite reports no data race
        run: |
          TSAN_OPTIONS=halt_on_error=0:report_bugs=1 \
            ./build_tsan/all_tests --gtest_filter=-PacletTest.* 2>&1 | tee tsan.log
          suite_status=${PIPESTATUS[0]}
          if grep -q "WARNING: ThreadSanitizer" tsan.log; then
            echo "ThreadSanitizer reported a race"; exit 1
          fi
          if [ "$suite_status" -ne 0 ]; then
            echo "the suite itself exited $suite_status under this sanitizer"; exit "$suite_status"
          fi

  sanitizers:
    # After the plain suite: no sanitizer build when it already fails. Nightly, on pull requests
    # and by hand; a push does not run it.
    needs: linux-tests
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build

      - name: Configure + build UBSan
        run: >
          cmake -S . -B build_ubsan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DENABLE_UBSAN=ON -DBUILD_GPU=OFF -DBUILD_WOLFRAM_LANGUAGE_PACLET=OFF
          -DBUILD_VISUALIZATION=OFF &&
          cmake --build build_ubsan --target all_tests

      # halt_on_error=0 so one finding does not hide the rest; the grep is what fails the job,
      # because UBSan reports a runtime error without changing the process exit status.
      - name: UBSan — the suite reports no runtime error
        run: |
          UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=0 \
            ./build_ubsan/all_tests --gtest_filter=-PacletTest.* 2>&1 | tee ubsan.log
          # PIPESTATUS[0], not $?, which is tee's and is always 0. The sanitizer's own finding
          # does not move the exit status, so the grep has to gate -- but the SUITE's status
          # does move, and discarding it passed a job whose tests failed or crashed outright.
          suite_status=${PIPESTATUS[0]}
          if grep -q "runtime error" ubsan.log; then
            echo "UBSan reported a runtime error"; exit 1
          fi
          if [ "$suite_status" -ne 0 ]; then
            echo "the suite itself exited $suite_status under this sanitizer"; exit "$suite_status"
          fi

      # detect_leaks=0 because LeakSanitizer cannot run where this was verified: under WSL2 it
      # dies with "Can't open /proc/<pid>/task for reading" before any test executes, which also
      # breaks CMake's post-build gtest_discover_tests step. What is gated here is what was
      # measured -- the addressability errors -- not leak detection nobody has run.
      - name: Configure + build ASan
        run: >
          cmake -S . -B build_asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DENABLE_ASAN=ON -DBUILD_GPU=OFF -DBUILD_WOLFRAM_LANGUAGE_PACLET=OFF
          -DBUILD_VISUALIZATION=OFF &&
          ASAN_OPTIONS=detect_leaks=0 cmake --build build_asan --target all_tests

      - name: ASan — the suite reports no addressability error
        run: |
          ASAN_OPTIONS=detect_leaks=0:halt_on_error=0 \
            ./build_asan/all_tests --gtest_filter=-PacletTest.* 2>&1 | tee asan.log
          # PIPESTATUS[0], not $?, which is tee's and is always 0. The sanitizer's own finding
          # does not move the exit status, so the grep has to gate -- but the SUITE's status
          # does move, and discarding it passed a job whose tests failed or crashed outright.
          suite_status=${PIPESTATUS[0]}
          if grep -q "ERROR: AddressSanitizer" asan.log; then
            echo "AddressSanitizer reported an error"; exit 1
          fi
          if [ "$suite_status" -ne 0 ]; then
            echo "the suite itself exited $suite_status under this sanitizer"; exit "$suite_status"
          fi

      # LeakSanitizer executes HERE and nowhere else: under WSL2 it dies before any test runs
      # ("Can't open /proc/<pid>/task"), so this leg is the only leak detection the suite gets.
      # The first full pass reported no leaks, so a report here is a regression and gates.
      - name: LSan — the suite leaks nothing
        run: |
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=0 \
            ./build_asan/all_tests --gtest_filter=-PacletTest.* 2>&1 | tee lsan.log
          # PIPESTATUS[0], not $?, which is tee's and is always 0. The sanitizer's own finding
          # does not move the exit status, so the grep has to gate -- but the SUITE's status
          # does move, and discarding it passed a job whose tests failed or crashed outright.
          suite_status=${PIPESTATUS[0]}
          if grep -q "ERROR: LeakSanitizer" lsan.log; then
            echo "LeakSanitizer reported leaks"
            grep -A4 "SUMMARY: AddressSanitizer" lsan.log || true
            exit 1
          fi
          if [ "$suite_status" -ne 0 ]; then
            echo "the suite itself exited $suite_status under this sanitizer"; exit "$suite_status"
          fi
          echo "no leaks reported"


  # The engine on wasm32, where no thread exists. The compile leg alone does not say the
  # engine WORKS there: it compiled for months while the first evolution trapped in
  # JobSystem::start() with "thread constructor failed". So this leg RUNS the oracle corpus
  # under node and requires it exact, which is the same check the native suite makes.
  wasm-oracle-corpus:
    # After the plain suite: no sanitizer build when it already fails, and three jobs of this
    # workflow hold a runner at a time rather than six.
    needs: linux-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.7

      - name: Configure
        run: >
          emcmake cmake -S . -B build_wasm
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_WOLFRAM_LANGUAGE_PACLET=OFF
          -DBUILD_GPU=OFF
          -DBUILD_VISUALIZATION=OFF
          -DBUILD_TESTS=OFF

      - name: Build the engine library and the corpus consumer
        run: cmake --build build_wasm --target hypergraph cost_matrix -j2

      # --serial: the wasm engine has no threads. Exit code is the exactness verdict.
      - name: Run the oracle corpus on wasm32
        run: node build_wasm/cost_matrix.js --serial


  # THE PAPER IS A DELIVERABLE AND NOTHING BUILT IT. Two defects shipped in its build unnoticed:
  # main.pdf did not depend on the twenty-one generated fragments it \input's, so regenerating
  # every number and running `make` reported "Nothing to be done" and left the previous run's
  # numbers in the pdf; and `make arxiv` packed main.tex, references.bib and figures/ without
  # tables/, so the submission could not compile at the other end. Both are the kind of thing a
  # build catches immediately and a human catches at the worst moment.
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: the integrity check diffs each fragment's provenance commit against
      # HEAD, and a shallow clone would fail every lookup rather than judge staleness.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The set the document actually names, checked against its preamble: pgfplots, tikz and
      # placeins from latex-extra; algorithm/algpseudocode, microtype and listings from the same;
      # natbib, booktabs, geometry and amsthm from latex-recommended. lmodern is named EXPLICITLY:
      # texlive-fonts-recommended no longer pulls it on the current runner image, and the paper
      # job failed on every run with "File `lmodern.sty' not found" until it was listed here.
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-pictures texlive-science lmodern

      # Not `make`: a target that decides there is nothing to do would pass this job without
      # compiling anything, which is the defect above rather than a check for it.
      - name: The paper compiles from a clean tree
        run: make -C paper -B

      # Builds a copy of the submission from its own files before packing, so a fragment missing
      # from the tarball fails HERE rather than on submission.
      - name: The arXiv submission compiles on its own
        run: make -C paper arxiv

      - name: Every fragment the paper inputs is present, and every fragment is inputted
        run: |
          cd paper
          grep -hoE '\\input\{tables/[a-z0-9_]+\}' main.tex sections/*.tex | sed 's/.*tables\///; s/}//' | sort -u > /tmp/inputs
          ls tables/*.tex | xargs -n1 basename | sed 's/\.tex$//' | sort -u > /tmp/have
          if ! diff -u /tmp/inputs /tmp/have; then
            echo "the set of \\input'd fragments and the set of shipped fragments differ"
            exit 1
          fi
          echo "$(wc -l < /tmp/have) fragments, all inputted, all present"

      # The measured content percolates: every fragment carries provenance, no verdict token
      # is typeset as data, and no fragment describes an engine that has since changed. A
      # committed paper carried a DIFFERS column and a device table measured on a kernel
      # three rewrites old; both classes are red here now, not findings for a reader.
      - name: The paper's measurements describe the engine at HEAD
        run: python3 tools/dev/paper_integrity_check.py
