name: Paclet + Wolfram golden

# Builds the Wolfram Language paclet against the FREE Wolfram Engine and runs the golden
# corpus (reference/verify_paclet.wls: States/Events/Causal/Branchial vs golden_corpus.wl).
# Runs on GitHub-hosted runners (free for this public repo). No local machine involved.
#
# ONE-TIME SETUP (repo Settings -> Secrets and variables -> Actions):
#   Add a secret so the Free Wolfram Engine can license headlessly. Either:
#     WOLFRAM_ID + WOLFRAM_PASSWORD   (a free Wolfram account), or
#     WOLFRAMSCRIPT_ENTITLEMENTID     (an on-demand entitlement from your Wolfram account)
#   The Free Wolfram Engine for Developers is free: https://www.wolfram.com/engine/

on:
  workflow_dispatch:        # manual until the license secret is wired, then add push/pr
  # push: { branches: [master] }
  # pull_request:

jobs:
  paclet-golden:
    runs-on: ubuntu-latest
    # The secrets context cannot be referenced from a step `if:`; job-level env can, so hoist the
    # license secrets here and gate the licensing steps on env instead.
    env:
      WOLFRAM_ID: ${{ secrets.WOLFRAM_ID }}
      WOLFRAM_PASSWORD: ${{ secrets.WOLFRAM_PASSWORD }}
      WOLFRAMSCRIPT_ENTITLEMENTID: ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build

      # A license secret is REQUIRED. Without one the Engine installs and then refuses to
      # evaluate, so the golden corpus below would fail for a reason that has nothing to do with
      # this repository. Checked first so that is said plainly rather than discovered three steps
      # later.
      - name: Require a license secret
        run: |
          if [ -z "${WOLFRAM_ID}" ] && [ -z "${WOLFRAMSCRIPT_ENTITLEMENTID}" ]; then
            echo "No Wolfram license secret is configured on this repository."
            echo "Set WOLFRAMSCRIPT_ENTITLEMENTID, or WOLFRAM_ID with WOLFRAM_PASSWORD, in"
            echo "Settings -> Secrets and variables -> Actions. The Free Wolfram Engine for"
            echo "Developers is free: https://www.wolfram.com/engine/"
            exit 1
          fi

      - name: Install Free Wolfram Engine
        run: |
          set -euo pipefail
          # The endpoint answers with a JSON error body rather than an HTTP error when it will
          # not serve the installer, and bash will happily try to execute that: a dead URL showed
          # up as "line 1: success:false: command not found" after downloading 67 bytes. So the
          # download is checked for being an installer before it is run.
          curl -fL --retry 3 -o /tmp/WolframEngine.sh \
            "https://account.wolfram.com/download/public/wolfram-engine/desktop/LINUX"
          if [ "$(stat -c%s /tmp/WolframEngine.sh)" -lt 1000000 ]; then
            echo "The download is not an installer. The endpoint returned:"
            head -c 500 /tmp/WolframEngine.sh; echo
            echo "The URL is version-pinned in this workflow and needs updating."
            exit 1
          fi
          sudo bash /tmp/WolframEngine.sh -- -auto -verbose
          wolframscript -version

      - name: License (on-demand entitlement, if provided)
        if: env.WOLFRAMSCRIPT_ENTITLEMENTID != ''
        run: echo "using on-demand entitlement licensing"

      - name: License (Wolfram ID activation, fallback)
        if: env.WOLFRAM_ID != ''
        run: |
          # Activate the Free Engine with a Wolfram account (headless). Adjust to your account type.
          wolframscript -authenticate "$WOLFRAM_ID" "$WOLFRAM_PASSWORD" || true

      - name: Build the paclet (finds the Engine's LibraryLink SDK)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_WOLFRAM_LANGUAGE_PACLET=ON -DBUILD_GPU=OFF -DBUILD_VISUALIZATION=OFF
          cmake --build build --target paclet

      - name: Golden corpus (HGEvolve vs golden_corpus.wl)
        run: wolframscript -file reference/verify_paclet.wls

      # Sessions are a LIFETIME -- open, refuse a second open, step, close, reopen -- and a
      # lifetime cannot be asserted from one call, so it gets its own script. The comparison
      # that matters is against an independent one-shot HGEvolve at every prefix depth: a
      # session that restarted would report depth-1 numbers forever and pass any check that
      # only asked whether it answered.
      - name: Sessions continue rather than restart (HGSession* verbs)
        run: wolframscript -file reference/verify_sessions.wls
