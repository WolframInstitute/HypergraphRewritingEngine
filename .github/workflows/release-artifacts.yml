# Release artifacts: the Python sdist, the Python wheels and the hg_evolve binaries, built from a
# clean checkout of the commit it is started on. Started by hand only (gh workflow run
# release-artifacts.yml); a push or a pull request never runs it. It uploads the artifacts to the
# run and publishes nothing.
name: Release artifacts

on:
  workflow_dispatch:

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the sdist
        run: pipx run build --sdist --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The configuration (Python versions, platforms, the test suite against each wheel) is in
      # pyproject.toml [tool.cibuildwheel].
      - uses: pypa/cibuildwheel@v4.3.5
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4
          # The Linux wheels build in a container; the commit for their build stamp is passed in.
          CIBW_ENVIRONMENT_LINUX: CMAKE_BUILD_PARALLEL_LEVEL=4 SKBUILD_CMAKE_DEFINE=HG_BUILD_COMMIT=${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  hg_evolve:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: Linux-x86-64, container: quay.io/pypa/manylinux_2_28_x86_64 }
          - { os: ubuntu-24.04-arm, platform: Linux-ARM64, container: quay.io/pypa/manylinux_2_28_aarch64 }
          - { os: windows-latest, platform: Windows-x86-64, container: '' }
          - { os: macos-14, platform: MacOSX-ARM64, container: '' }
    runs-on: ${{ matrix.os }}
    # Linux builds in manylinux_2_28 (glibc 2.28), so the binary runs on glibc 2.28 and later.
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4
      - name: Mark the checkout safe for git (the build stamp reads the commit)
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_WOLFRAM_LANGUAGE_PACLET=OFF
          -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_GPU=OFF
          -DHG_ENGINE_STATS=OFF -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DHG_BUILD_COMMIT=${{ github.sha }}
      - name: Build
        shell: bash
        run: cmake --build build --target hg_evolve --config Release -j4
      - name: Collect and check
        shell: bash
        run: |
          mkdir -p out/${{ matrix.platform }}
          f=$(find build/LibraryResources -name 'hg_evolve' -o -name 'hg_evolve.exe' | head -1)
          cp "$f" out/${{ matrix.platform }}/
          "out/${{ matrix.platform }}/$(basename "$f")" --version
      - uses: actions/upload-artifact@v4
        with:
          name: hg_evolve-${{ matrix.platform }}
          path: out/
